[project]
name = "4d-language-aware-lens"
version = "2.0.0"
description = "A transparent, regex-and-lexicon heuristic for reviewing selected rhetorical patterns in English text."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "4D Language-Aware Lens contributors" },
]
keywords = ["linguistics", "discourse-analysis", "heuristics", "text-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
